# Temporary integration test: Kelee full iOS Loon User-Agent
# Author: chance
# Updated: 2026-10-01
# Category: Automation / Integration Test / Source Fetch

name: FleaMarket Full-Loon-UA Self-Heal Test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fleamarket-full-loon-ua-test.yml"

permissions:
  contents: read

jobs:
  self-heal:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Save baseline and isolate FleaMarket catalog
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p monitor/.runtime/fleamarket-full-loon
          cp .github/sources/loon.json /tmp/wayx-loon-catalog.json
          {
            sha256sum "Resource/Loon/FleaMarket_remove_ads.lpx"
            sha256sum "Adblock/Quantumult X/FleaMarket_remove_ads.snippet"
            sha256sum "Adblock/Surge/FleaMarket_remove_ads.sgmodule"
            if [ -d "script/FleaMarket" ]; then
              find "script/FleaMarket" -type f -print0 | sort -z | xargs -0 -r sha256sum
            fi
          } > monitor/.runtime/fleamarket-full-loon/before.sha256

          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const file='.github/sources/loon.json';
          const catalog=JSON.parse(fs.readFileSync(file,'utf8'));
          const entry=catalog.find(x=>x.id==='FleaMarket');
          if (!entry) throw new Error('FleaMarket catalog entry missing');
          fs.writeFileSync(file,JSON.stringify([entry],null,2)+'\n');
          NODE

      - name: Probe full iOS Loon UAs proven in public GitHub automation
        id: probe
        shell: bash
        run: |
          set -euo pipefail
          URL="https://kelee.one/Tool/Loon/Lpx/FleaMarket_remove_ads.lpx"
          OUT="monitor/.runtime/fleamarket-full-loon/probe.txt"
          : > "$OUT"

          probe() {
            name="$1"
            ua="$2"
            body="/tmp/$name.body"
            hdr="/tmp/$name.headers"
            code="$(curl -4 -sS -L --connect-timeout 10 --max-time 20 -A "$ua" -H 'Accept: */*' -D "$hdr" -o "$body" -w '%{http_code}' "$URL" || true)"
            bytes="$(wc -c < "$body" 2>/dev/null || echo 0)"
            {
              echo "[$name] http=$code bytes=$bytes"
              echo "ua=$ua"
              grep -iE '^(server|content-type|location|cf-ray|x-|via):' "$hdr" || true
              echo
            } | tee -a "$OUT" >&2

            if [ "$code" = "200" ] && grep -q '^#!name=' "$body"; then
              printf '%s' "$ua"
              return 0
            fi
            return 1
          }

          selected=""
          if selected="$(probe darkings 'Loon/764 CFNetwork/1498.700.1 Darwin/23.6.0 iPhone/17.6.1')"; then
            :
          elif selected="$(probe proxy-config 'Loon/3.5.2 (996) CFNetwork/3826 Darwin/25.0.0')"; then
            :
          fi

          if [ -z "$selected" ]; then
            echo "::error title=Kelee upstream::Both full iOS Loon UA variants failed."
            exit 1
          fi
          echo "selected=$selected" >> "$GITHUB_OUTPUT"
          echo "selected=$selected" >> "$OUT"

      - name: Delete managed FleaMarket artifacts in runner
        shell: bash
        run: |
          set -euo pipefail
          rm -f "Resource/Loon/FleaMarket_remove_ads.lpx"
          rm -f "Adblock/Quantumult X/FleaMarket_remove_ads.snippet"
          rm -f "Adblock/Surge/FleaMarket_remove_ads.sgmodule"
          rm -rf "script/FleaMarket"
          test ! -e "Resource/Loon/FleaMarket_remove_ads.lpx"
          test ! -e "Adblock/Quantumult X/FleaMarket_remove_ads.snippet"
          test ! -e "Adblock/Surge/FleaMarket_remove_ads.sgmodule"

      - name: Inject selected UA into runner-only source fetch
        shell: bash
        env:
          KELEE_UA: ${{ steps.probe.outputs.selected }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const file='converter/src/source-fetch.mjs';
          const ua=process.env.KELEE_UA;
          const text=fs.readFileSync(file,'utf8');
          const next=text.replace(
            /export const WAYX_FETCH_UA = '[^']*';/,
            'export const WAYX_FETCH_UA = ' + JSON.stringify(ua) + ';'
          );
          if (next===text) throw new Error('WAYX_FETCH_UA replacement failed');
          fs.writeFileSync(file,next);
          NODE

      - name: Run production sync conversion
        run: node .github/scripts/sync-convert.mjs 2>&1 | tee monitor/.runtime/fleamarket-full-loon/sync.log

      - name: Restore full catalog
        if: always()
        run: cp /tmp/wayx-loon-catalog.json .github/sources/loon.json

      - name: Verify regenerated artifacts
        shell: bash
        run: |
          set -euo pipefail
          test -s "Resource/Loon/FleaMarket_remove_ads.lpx"
          test -s "Adblock/Quantumult X/FleaMarket_remove_ads.snippet"
          test -s "Adblock/Surge/FleaMarket_remove_ads.sgmodule"
          {
            sha256sum "Resource/Loon/FleaMarket_remove_ads.lpx"
            sha256sum "Adblock/Quantumult X/FleaMarket_remove_ads.snippet"
            sha256sum "Adblock/Surge/FleaMarket_remove_ads.sgmodule"
            if [ -d "script/FleaMarket" ]; then
              find "script/FleaMarket" -type f -print0 | sort -z | xargs -0 -r sha256sum
            fi
          } > monitor/.runtime/fleamarket-full-loon/after.sha256
          diff -u monitor/.runtime/fleamarket-full-loon/before.sha256 monitor/.runtime/fleamarket-full-loon/after.sha256             > monitor/.runtime/fleamarket-full-loon/before-after.diff || true

      - name: Canonical and audit checks
        shell: bash
        run: |
          set -euo pipefail
          node converter/tools/regenerate-canonical.mjs
          node converter/tools/audit-repository.mjs
          node converter/tools/conversion-reports.mjs
          node converter/tests/generated-helper-refs.mjs
          node converter/tests/source-script-url-preservation.mjs

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fleamarket-full-loon-ua-evidence
          if-no-files-found: error
          path: |
            Resource/Loon/FleaMarket_remove_ads.lpx
            Adblock/Quantumult X/FleaMarket_remove_ads.snippet
            Adblock/Surge/FleaMarket_remove_ads.sgmodule
            script/FleaMarket/**
            monitor/.runtime/fleamarket-full-loon/**
