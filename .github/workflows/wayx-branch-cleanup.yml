            const head=context.payload.pull_request.head;
            expected.push({name:head.ref,sha:head.sha});
            const unique=[...new Map(expected.map(b=>[b.name,b])).values()];
            if(context.repo.owner!=='JuemingDC'||context.repo.repo!=='WayX')throw new Error('Wrong repository');
            const {data:meta}=await github.rest.repos.get(repo);
            if(meta.default_branch!=='main')throw new Error('Default branch changed');
            for(const b of unique){
              if(b.name==='main')throw new Error('Refusing main');
              try{
                const {data:ref}=await github.rest.git.getRef({...repo,ref:'heads/'+b.name});
                if(ref.object.sha!==b.sha)throw new Error('Branch advanced: '+b.name);
              }catch(e){if(e.status===404)b.absent=true;else throw e;}
            }
            const {data:main}=await github.rest.git.getRef({...repo,ref:'heads/main'});
            const {data:commit}=await github.rest.git.getCommit({...repo,commit_sha:main.object.sha});
            const {data:tree}=await github.rest.git.createTree({...repo,base_tree:commit.tree.sha,tree:[{
             path:'.github/branch-archive.json',mode:'100644',type:'blob',content:JSON.stringify({date:'2026-10-03',main:main.object.sha,branches:unique},null,2)+'\n'
            }]});
            let archive=main.object.sha;
            const tips=[...new Set(unique.filter(b=>!b.absent).map(b=>b.sha))];
            for(let i=0;i<tips.length;i+=30){
             const {data:saved}=await github.rest.git.createCommit({...repo,message:'archive: preserve WayX branch tips before authorized cleanup',tree:tree.sha,parents:[archive,...tips.slice(i,i+30)]});
             archive=saved.sha;
            }
            const tag='archive/branches-2026-10-03-'+context.runId+'-'+context.runAttempt;
            await github.rest.git.createRef({...repo,ref:'refs/tags/'+tag,sha:archive});
            const deleted=[];
            for(const b of unique.filter(b=>!b.absent)){
             const {data:current}=await github.rest.git.getRef({...repo,ref:'heads/'+b.name});
             if(current.object.sha!==b.sha)throw new Error('Branch advanced after archive: '+b.name);
             await github.rest.git.deleteRef({...repo,ref:'heads/'+b.name});
             deleted.push(b.name);
            await new Promise(resolve=>setTimeout(resolve,1500));
            }
            const remaining=await github.paginate(github.rest.repos.listBranches,{...repo,per_page:100});
            await core.summary.addHeading('WayX branch cleanup').addRaw('Archive tag: '+tag+'\n\n').addRaw('Deleted branches: '+deleted.length+'\n\n').addRaw('Remaining: '+remaining.map(b=>b.name).join(', ')+'\n').write();
            console.log(JSON.stringify({tag,archive,deleted:deleted.length,remaining:remaining.map(b=>b.name)}));
            if(remaining.some(b=>b.name!=='main'))throw new Error('Unexpected remaining branches');
