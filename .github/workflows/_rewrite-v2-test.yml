name: WayX Rewrite V2 Safety Test

on:
  push:
    paths:
      - ".github/workflows/_rewrite-v2-test.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Syntax
        run: |
          node --check .github/scripts/sync-convert.mjs
          python -m py_compile .github/scripts/conversion_gate.py .github/scripts/validate_conversion_policy.py

      - name: Prepare Rewrite v2 fixture
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/wayx-v2
          cat > /tmp/wayx-v2/TestV2.lpx <<'EOF'
          #!name=RewriteV2Test
          #!desc=safe reject semantics
          [Rewrite]
          request if ${url} ~= /^https:\/\/api\.example\/dict$/ then reject_dict(200)
          request if ${url} ~= /^https:\/\/api\.example\/empty$/ then reject(200)
          request if ${url} ~= /^https:\/\/api\.example\/array$/ then reject_array(451)

          [MitM]
          hostname=api.example
          EOF
          cat > .github/sources/loon.json <<'EOF'
          [
            {
              "id": "TestV2",
              "file": "TestV2.lpx",
              "source": "http://127.0.0.1:8766/TestV2.lpx",
              "qx": "TestV2.snippet",
              "surge": "TestV2.sgmodule",
              "category": "测试"
            }
          ]
          EOF
          python -m http.server 8766 --directory /tmp/wayx-v2 >/tmp/wayx-v2-http.log 2>&1 &
          echo $! > /tmp/wayx-v2-http.pid
          sleep 1

      - name: Safe Rewrite v2 reject conversion
        shell: bash
        run: |
          set -euo pipefail
          node .github/scripts/sync-convert.mjs
          QX="adblock/TestV2/QuantumultX/TestV2.snippet"
          SG="adblock/TestV2/Surge/TestV2.sgmodule"
          grep -Fq '^https:\/\/api\.example\/dict$ url reject-dict' "$QX"
          grep -Fq '^https:\/\/api\.example\/empty$ url reject' "$QX"
          if grep -Fq '^https:\/\/api\.example\/empty$ url reject-200' "$QX"; then
            echo "reject(200) was incorrectly mapped to reject-200" >&2
            exit 1
          fi
          grep -Fq '^https:\/\/api\.example\/array$ url reject-array' "$QX"
          grep -Fq '^https:\/\/api\.example\/empty$ _ reject' "$SG"
          grep -Fq 'data="{}" status-code=200' "$SG"
          python .github/scripts/validate_conversion_policy.py
          python .github/scripts/conversion_gate.py
          grep -q "SAFE" monitor/.runtime/conversion_gate.md

      - name: Regex flag is Review Tier
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's#/dict\$/ then#/dict$/i then#' /tmp/wayx-v2/TestV2.lpx
          node .github/scripts/sync-convert.mjs
          python .github/scripts/conversion_gate.py
          grep -q "Work required" monitor/.runtime/conversion_gate.md
          grep -q "Unsupported Loon Rewrite v2" adblock/TestV2/QuantumultX/TestV2.snippet

      - name: Stop local server
        if: always()
        run: kill "$(cat /tmp/wayx-v2-http.pid)" 2>/dev/null || true
