# Chance Work Review Finalizer
# Author: chance
# Updated: 2026-09-28
# Category: Automation / Work Review / Cleanup

name: Work Review Finalizer

on:
  pull_request_target:
    types: [labeled, closed]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  finalize-complete:
    if: >
      github.event.action == 'labeled' &&
      github.event.label.name == 'work-complete' &&
      github.event.pull_request.base.ref == 'main' &&
      startsWith(github.event.pull_request.head.ref, 'work/upstream-') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify managed review PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          LABELS="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json labels --jq '[.labels[].name]')"
          HAS_REVIEW="$(jq -r 'index("work-review") != null' <<<"$LABELS")"
          HAS_REJECT="$(jq -r 'index("work-reject") != null' <<<"$LABELS")"
          if [ "$HAS_REVIEW" != "true" ]; then
            echo "Missing work-review label; refusing automatic merge."
            exit 1
          fi
          if [ "$HAS_REJECT" = "true" ]; then
            echo "Conflicting work-reject label found; refusing automatic merge."
            exit 1
          fi

      - name: Merge reviewed PR and delete branch
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --squash --delete-branch

  finalize-reject:
    if: >
      github.event.action == 'labeled' &&
      github.event.label.name == 'work-reject' &&
      github.event.pull_request.base.ref == 'main' &&
      startsWith(github.event.pull_request.head.ref, 'work/upstream-')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Close rejected PR without merge
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          LABELS="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json labels --jq '[.labels[].name]')"
          HAS_REVIEW="$(jq -r 'index("work-review") != null' <<<"$LABELS")"
          HAS_COMPLETE="$(jq -r 'index("work-complete") != null' <<<"$LABELS")"
          if [ "$HAS_REVIEW" != "true" ]; then
            echo "Missing work-review label; refusing automatic close."
            exit 1
          fi
          if [ "$HAS_COMPLETE" = "true" ]; then
            echo "Conflicting work-complete label found; refusing automatic reject."
            exit 1
          fi
          gh pr close "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --delete-branch

  cleanup:
    if: >
      github.event.action == 'closed' &&
      github.event.pull_request.base.ref == 'main' &&
      startsWith(github.event.pull_request.head.ref, 'work/upstream-')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Remove leftover temporary branch
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$HEAD_REF" >/dev/null 2>&1 || true
