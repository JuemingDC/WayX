name: Sync RuCu6 and Convert

on:
  workflow_dispatch:
  schedule:
    - cron: '15 19 * * *'

permissions:
  contents: write

concurrency:
  group: sync-rucu6
  cancel-in-progress: false

jobs:
  sync-convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests

      - name: Validate converter source
        run: python -m py_compile .github/scripts/sync_rucu6.py .github/scripts/convert_rucu6.py .github/scripts/validate_rucu6.py

      - name: Sync RuCu6 Cloudflare Pages sources
        env:
          HTTP_PROXY_URL: ${{ secrets.HTTP_PROXY_URL }}
        run: python .github/scripts/sync_rucu6.py

      - name: Convert Loon new syntax
        run: python .github/scripts/convert_rucu6.py

      - name: Validate Quantumult X and Surge outputs
        run: python .github/scripts/validate_rucu6.py

      - name: Commit only real changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Resource/Loon/RuCu6 script/RuCu6 adblock .github/reports
          if git diff --cached --quiet; then
            echo "No RuCu6 changes"
            exit 0
          fi
          git commit -m "Sync RuCu6 and update conversions"
          git push
