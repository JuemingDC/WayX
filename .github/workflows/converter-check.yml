name: WayX Source Fetch Probe
on:
  push:
    branches: [test]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: '35436ece412c4ec05e95cfaf13a5c1ff67e705f3'
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '^26.12.1'
      - name: Verify all plugins using production TypeScript acquisition
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs/promises';
          import {requestOriginal} from './src/ingest/resources.ts';
          import {identifyResource} from './src/ingest/formats.ts';
          const list=await requestOriginal('https://hub.kelee.one/list.json');
          const payload=JSON.parse(list.bytes.toString());
          const registry=JSON.parse(await fs.readFile('.github/sources/loon.json','utf8'));
          const fixed=JSON.parse(await fs.readFile('.github/sources/loon-static.json','utf8'));
          const entries=payload.lists.map(x=>({owner:'Kelee',url:new URL(x.url).searchParams.get('plugin')}));
          for(const x of [...registry,...fixed])if(new URL(x.source).hostname==='rucu6.pages.dev')entries.push({owner:'RuCu6',url:x.source});
          const unique=[...new Map(entries.map(x=>[x.url,x])).values()];
          const results=[];let next=0;
          await Promise.all(Array.from({length:4},async()=>{while(next<unique.length){const item=unique[next++];try{const r=await requestOriginal(item.url);results.push({...item,status:r.status,format:identifyResource(r.bytes,item.url),size:r.bytes.length});}catch(e){results.push({...item,error:e.message});}}}));
          for(const owner of ['Kelee','RuCu6']){const rows=results.filter(x=>x.owner===owner);console.log(JSON.stringify({owner,total:rows.length,valid:rows.filter(x=>x.format==='loon-text').length,failures:rows.filter(x=>x.format!=='loon-text')}));}
          if(results.some(x=>x.format!=='loon-text'))process.exitCode=1;
          JS
