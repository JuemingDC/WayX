name: Converter Check

on:
  pull_request:
    paths:
      - "converter/**"
      - ".github/scripts/sync-convert.mjs"
      - ".github/scripts/propose-conversion-issues.mjs"
      - ".github/workflows/converter-check.yml"
      - ".github/sources/loon.json"
      - ".github/manual-assets.json"
      - "CONVERSION_SPEC.md"
      - "docs/conversion-spec/**"
      - "Resource/Loon/**"
      - "script/**"
      - "Adblock/Quantumult X/**"
      - "Adblock/Surge/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Syntax check converter
        run: |
          for file in converter/src/*.mjs converter/tools/*.mjs; do
            node --check "$file"
          done
          node --check .github/scripts/sync-convert.mjs
          node --check converter/tests/checkpoint.mjs
          node --check converter/tests/loon-new-syntax-cases.mjs
          node --check converter/tests/surge-rule-coverage.mjs
          node --check converter/tests/end-to-end-golden.mjs
          node --check converter/tests/generic-identity.mjs
          node --check converter/tests/genericity-audit.mjs
          node --check converter/tests/spec-block-contract.mjs
          node --check converter/tests/complex-source-inventory.mjs
          node --check converter/tests/catalog-syntax-inventory.mjs
          node --check converter/tests/catalog-legacy-syntax-inventory.mjs
          node --check converter/tests/catalog-rule-inventory.mjs
          node --check converter/tests/rule-ast.mjs
          node --check converter/tests/rewrite-ir.mjs
          node --check converter/tests/rewrite-target-planners.mjs
          node --check converter/tests/script-ir-target-planners.mjs
          node --check converter/tests/source-section-comments.mjs
          node --check converter/tests/target-output-builders.mjs
          node --check converter/tests/conversion-pipeline.mjs
          node --check converter/tests/conversion-context-materializers.mjs
          node --check converter/tests/managed-artifacts.mjs
          node --check converter/tests/workflow-diagnostics.mjs
          node --check converter/tests/qx-official-capabilities.mjs
          node --check converter/tests/surge-official-capabilities.mjs
          node --check converter/tests/unknown-issue-markers.mjs
          node --check converter/tests/manual-assets.mjs
          node --check .github/scripts/propose-conversion-issues.mjs
          node --check converter/tests/generated-helper-refs.mjs
          node --check converter/tests/generated-helper-runtime.mjs
          node --check converter/tests/source-script-url-preservation.mjs
          python -m py_compile converter/tests/test_conversion_gate.py
          node --check converter/tools/regenerate-canonical.mjs
          node --check converter/tools/audit-repository.mjs
          node --check converter/tools/conversion-reports.mjs
      - name: Converter checkpoint
        run: |
          node converter/tests/checkpoint.mjs
          node converter/tests/loon-new-syntax-cases.mjs
          node converter/tests/surge-rule-coverage.mjs
          node converter/tests/end-to-end-golden.mjs
          node converter/tests/generic-identity.mjs
          node converter/tests/genericity-audit.mjs
          node converter/tests/spec-block-contract.mjs
          node converter/tests/complex-source-inventory.mjs
          node converter/tests/catalog-syntax-inventory.mjs
          node converter/tests/catalog-legacy-syntax-inventory.mjs
          node converter/tests/catalog-rule-inventory.mjs
          node converter/tests/rule-ast.mjs
          node converter/tests/rewrite-ir.mjs
          node converter/tests/rewrite-target-planners.mjs
          node converter/tests/script-ir-target-planners.mjs
          node converter/tests/source-section-comments.mjs
          node converter/tests/target-output-builders.mjs
          node converter/tests/conversion-pipeline.mjs
          node converter/tests/conversion-context-materializers.mjs
          node converter/tests/managed-artifacts.mjs
          node converter/tests/workflow-diagnostics.mjs
          node converter/tests/unknown-issue-markers.mjs
          node converter/tests/manual-assets.mjs
          python converter/tests/test_conversion_gate.py

      - name: Quantumult X official capability drift gate
        run: node converter/tests/qx-official-capabilities.mjs

      - name: Surge official capability drift gate
        run: node converter/tests/surge-official-capabilities.mjs

      - name: Generated helper runtime fixtures
        run: node converter/tests/generated-helper-runtime.mjs

      - name: Repository script syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find script converter .github/scripts -type f \( -name '*.js' -o -name '*.mjs' \) -print0)
          python -m py_compile .github/scripts/*.py monitor/*.py

      - name: Regenerate canonical outputs
        run: node converter/tools/regenerate-canonical.mjs --write

      - name: Audit regenerated repository
        run: node converter/tools/audit-repository.mjs

      - name: Generate reconciliation and Review inventory
        run: node converter/tools/conversion-reports.mjs

      - name: Verify generated helper references
        run: node converter/tests/generated-helper-refs.mjs

      - name: Verify regenerated MyBlockAds golden
        run: node converter/tests/myblockads-golden.mjs

      - name: Verify original Source Script URLs
        run: node converter/tests/source-script-url-preservation.mjs

      - name: Upload regenerated canonical outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canonical-converter-output
          if-no-files-found: error
          path: |
            Adblock/Quantumult X/*.snippet
            Adblock/Surge/*.sgmodule
            script/**
            monitor/.runtime/conversion-reconciliation.json
            monitor/.runtime/conversion-reconciliation.md
            monitor/.runtime/review-inventory.json
            monitor/.runtime/review-inventory.md

      - name: Commit deterministic generated outputs to same-repo PR
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        run: |
          set -euo pipefail
          git add -A -- "Adblock/Quantumult X" "Adblock/Surge" script
          if git diff --cached --quiet; then
            exit 0
          fi

          remote_sha="$(git ls-remote origin "refs/heads/${{ github.head_ref }}" | awk '{print $1}')"
          expected_sha="${{ github.event.pull_request.head.sha }}"
          if [[ -z "$remote_sha" || "$remote_sha" != "$expected_sha" ]]; then
            echo "::notice::PR head advanced while this run was executing; skip generated-output commit and let the newer run regenerate."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "canonical: regenerate converter outputs"
          git push origin HEAD:"${{ github.head_ref }}"

      - name: Verify canonical outputs are checked in
        shell: bash
        run: |
          set -euo pipefail
          status="$(git status --porcelain --untracked-files=all -- "Adblock/Quantumult X" "Adblock/Surge" script)"
          if [[ -n "$status" ]]; then
            printf '%s\n' "$status"
            exit 1
          fi
