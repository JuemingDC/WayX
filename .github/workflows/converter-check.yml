name: WayX Source Fetch Probe
on:
  push:
    branches: [test]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '^26.12.1'
      - name: Compare fetch HTTPS urllib and curl on the same runner
        shell: bash
        run: |
          cat > /tmp/probe.mjs <<'JS'
          import https from 'node:https';
          import {execFileSync} from 'node:child_process';
          const urls=['https://hub.kelee.one/list.json','https://kelee.one/Tool/Loon/Lpx/Jin10Data_remove_ads.lpx','https://rucu6.pages.dev/Plugins/amap.lpx'];
          const headers={'User-Agent':'Loon/860 CFNetwork/3826.500.111.2.2 Darwin/24.4.0','Accept':'*/*','Accept-Language':'zh-CN,zh-Hans;q=0.9'};
          for(const url of urls){
            try { const r=await fetch(url,{headers,signal:AbortSignal.timeout(20000)});const body=await r.text();console.log(JSON.stringify({client:'fetch',url,status:r.status,size:body.length,html:/^\s*</.test(body)})); } catch(e){console.log('fetch '+e.message);}
            try { await new Promise(resolve=>{const req=https.get(url,{headers,timeout:20000},r=>{let size=0;r.on('data',b=>size+=b.length);r.on('end',()=>{console.log(JSON.stringify({client:'https',url,status:r.statusCode,size}));resolve();});});req.on('timeout',()=>req.destroy(new Error('timeout')));req.on('error',e=>{console.log('https '+e.message);resolve();});}); } catch(e){console.log('https '+e.message);}
            try { console.log('curl '+execFileSync('curl',['-sSL','--max-time','20','-A',headers['User-Agent'],'-H','Accept-Language: '+headers['Accept-Language'],'-o','/tmp/probe-body','-w','%{http_code} %{size_download}',url],{encoding:'utf8'})); }catch(e){console.log('curl failed');}
            try {console.log(execFileSync('python3',['-c',"import urllib.request,sys,json; u=sys.argv[1]; r=urllib.request.urlopen(urllib.request.Request(u,headers=json.loads(sys.argv[2])),timeout=20); print(json.dumps({'client':'urllib','url':u,'status':r.status,'size':len(r.read())}))",url,JSON.stringify(headers)],{encoding:'utf8'}));}catch(e){console.log('urllib failed');}
          }
          JS
          node /tmp/probe.mjs
