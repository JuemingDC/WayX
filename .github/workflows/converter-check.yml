name: WayX Automation

on:
  pull_request:
    paths:
      - '.github/**'
      - 'Resource/Loon/**'
      - 'Adblock/**'
      - 'Script/**'
      - 'Boxjs/**'
      - 'Module/**'
      - 'Rule/**'
      - 'README.md'
  workflow_dispatch:
  schedule:
    # 01:30 Asia/Shanghai; the schedule uses UTC.
    - cron: '30 17 * * *'

permissions:
  contents: write
  issues: write

concurrency:
  group: wayx-${{ github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  automation:
    if: github.event_name == 'pull_request' || github.ref_name == 'main' || github.ref_name == 'test'
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    env:
      PUBLISH_BRANCH: ${{ github.event_name != 'pull_request' && github.ref_name || (github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'test' && 'test' || '') }}
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout requested baseline
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          check-latest: true
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          check-latest: true

      - name: Prepare runtime logs and enforce branch budget
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/automation.py prepare

      - name: Syntax check repository JavaScript and Python
        id: syntax
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/automation.py syntax

      - name: Refresh plugin catalogs and prune retired artifacts
        id: catalog
        env:
          RUCU6_LIST_URL: ${{ vars.RUCU6_LIST_URL }}
        if: steps.syntax.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python .github/converter/tools/refresh-kelee-catalog.py 2>&1 | tee .github/monitor/.runtime/catalog.log

      - name: Converter checkpoint
        id: checkpoint
        if: steps.catalog.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/automation.py checkpoint 2>&1 | tee .github/monitor/.runtime/checkpoint.log

      - name: Pull discovered upstreams and convert
        id: loon_sync
        if: steps.checkpoint.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          node .github/scripts/sync-convert.mjs 2>&1 | tee .github/monitor/.runtime/loon-sync.log

      - name: Verify complete generated repository
        id: verify
        if: steps.loon_sync.outputs.publishable == 'true'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/automation.py verify 2>&1 | tee .github/monitor/.runtime/verification.log

      - name: Check monitored upstream specifications
        id: monitor
        if: env.PUBLISH_BRANCH != '' && steps.syntax.outcome == 'success'
        continue-on-error: true
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python .github/monitor/monitor_upstreams.py 2>&1 | tee .github/monitor/.runtime/monitor.log

      - name: Generate reconciliation and Review inventory
        id: reports
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          node .github/converter/tools/conversion-reports.mjs 2>&1 | tee .github/monitor/.runtime/reports.log

      - name: Create or update conversion issues
        id: issues
        if: always()
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_BRANCH: ${{ env.PUBLISH_BRANCH }}
        run: |
          set -euo pipefail
          python .github/scripts/automation.py issues 2>&1 | tee .github/monitor/.runtime/issues.log

      - name: Evaluate publication gates
        id: gate
        if: always()
        shell: bash
        env:
          STAGES: ${{ toJSON(steps) }}
          SYNC_PUBLISHABLE: ${{ steps.loon_sync.outputs.publishable }}
          MONITOR_ENABLED: ${{ env.PUBLISH_BRANCH != '' && 'true' || 'false' }}
          MONITOR_COMPLETE: ${{ steps.monitor.outputs.complete }}
        run: |
          set -euo pipefail
          python .github/scripts/automation.py gate

      - name: Publish validated outputs to the existing branch
        id: publish
        if: always()
        continue-on-error: true
        shell: bash
        env:
          PUBLISHABLE: ${{ steps.gate.outputs.publishable }}
          PUBLISH_BRANCH: ${{ env.PUBLISH_BRANCH }}
          EXPECTED_HEAD: ${{ env.EXPECTED_HEAD }}
          MONITOR_ENABLED: ${{ env.PUBLISH_BRANCH != '' && 'true' || 'false' }}
        run: |
          set -euo pipefail
          python .github/scripts/automation.py publish

      - name: Record run summary
        if: always()
        shell: bash
        env:
          PUBLICATION: ${{ steps.publish.outputs.publication }}
        run: |
          set -euo pipefail
          python .github/scripts/automation.py summary

      - name: Upload automation reports and generated outputs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: wayx-conversion-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14
          path: |
            .github/monitor/.runtime/
            .github/sources/loon.json
            Resource/Loon/
            Adblock/Quantumult X/
            Adblock/Surge/
            Script/
            README.md

      - name: Surface blocked or failed publication
        if: always()
        shell: bash
        env:
          PUBLISHABLE: ${{ steps.gate.outputs.publishable }}
          PUBLICATION_OUTCOME: ${{ steps.publish.outcome }}
        run: |
          set -euo pipefail
          python .github/scripts/automation.py final

