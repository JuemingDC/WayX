name: Converter Check

on:
  pull_request:
    paths:
      - "converter/**"
      - ".github/scripts/sync-convert.mjs"
      - ".github/workflows/converter-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax check converter
        run: |
          for file in converter/src/*.mjs converter/tools/*.mjs; do
            node --check "$file"
          done
          node --check .github/scripts/sync-convert.mjs
          node --check converter/tests/checkpoint.mjs
          node --check converter/tests/rucu6-rewrite-v2-coverage.mjs
          node --check converter/tests/rucu6-script-v2-coverage.mjs
          node --check converter/tests/loon-new-syntax-cases.mjs
          node --check converter/tests/surge-rule-coverage.mjs
          node --check converter/tests/end-to-end-golden.mjs
          node --check converter/tools/regenerate-canonical.mjs
      - name: Converter checkpoint
        run: |
          node converter/tests/checkpoint.mjs
          node converter/tests/myblockads-golden.mjs
          node converter/tests/rucu6-rewrite-v2-coverage.mjs
          node converter/tests/rucu6-script-v2-coverage.mjs
          node converter/tests/loon-new-syntax-cases.mjs
          node converter/tests/surge-rule-coverage.mjs
          node converter/tests/end-to-end-golden.mjs

      - name: Regenerate canonical outputs
        run: node converter/tools/regenerate-canonical.mjs --write

      - name: Upload regenerated canonical outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canonical-converter-output
          if-no-files-found: error
          path: |
            Adblock/Quantumult X/*.snippet
            Adblock/Surge/*.sgmodule

      - name: Verify canonical outputs are checked in
        run: git diff --exit-code -- "Adblock/Quantumult X" "Adblock/Surge"
