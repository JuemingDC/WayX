name: Converter Check

on:
  pull_request:
    paths:
      - ".github/converter/**"
      - ".github/scripts/sync-convert.mjs"
      - ".github/scripts/propose-conversion-issues.mjs"
      - ".github/workflows/converter-check.yml"
      - ".github/workflows/upstream-monitor.yml"
      - ".github/monitor/**"
      - ".github/sources/loon.json"
      - ".github/sources/loon-static.json"
      - ".github/manual-assets.json"
      - ".github/CONVERSION_SPEC.md"
      - "Resource/Loon/**"
      - "Script/**"
      - "Boxjs/**"
      - "Module/**"
      - "Rule/**"
      - "README.md"
      - "Adblock/Quantumult X/**"
      - "Adblock/Surge/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Enforce main and test branch budget
        shell: bash
        run: |
          set -euo pipefail
          refs="$(git ls-remote --heads origin)"
          mapfile -t branches < <(awk '{sub("refs/heads/", "", $2); print $2}' <<< "$refs")
          if (( ${#branches[@]} < 1 || ${#branches[@]} > 2 )); then
            echo "::error::WayX permits main and at most one test branch."
            exit 1
          fi
          main_present=false
          for branch in "${branches[@]}"; do
            case "$branch" in
              main) main_present=true ;;
              test) ;;
              *) echo "::error::Unexpected WayX branch: $branch"; exit 1 ;;
            esac
          done
          "$main_present"

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Syntax check repository JavaScript and Python
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find .github/converter .github/scripts Script -type f \( -name '*.js' -o -name '*.mjs' \) -print0)
          python -m compileall -q .github/converter .github/scripts .github/monitor

      - name: Refresh Kelee ad-block and dependency catalog
        run: python .github/converter/tools/refresh-kelee-catalog.py

      - name: Converter checkpoint
        run: |
          node .github/converter/tests/rewrite.mjs
          node .github/converter/tests/conversion.mjs
          node .github/converter/tests/architecture.mjs
          node .github/converter/tests/core.mjs
          node .github/converter/tests/script.mjs
          node .github/converter/tests/workflow.mjs

      - name: Official QX and Surge capability drift gates
        run: node .github/converter/tests/official-capabilities.mjs

      - name: Generated helper runtime fixtures
        run: |
          jq --version
          node .github/converter/tests/runtime.mjs

      - name: Pull discovered upstreams and convert
        shell: bash
        run: |
          set -o pipefail
          node .github/scripts/sync-convert.mjs

      - name: Regenerate canonical outputs
        run: node .github/converter/tools/regenerate-canonical.mjs --write

      - name: Regenerate README index
        run: node .github/converter/tools/update-readme.mjs --write

      - name: Validate refreshed catalog semantics
        run: |
          node .github/converter/tests/catalog.mjs

      - name: Verify managed conversion cleanliness
        run: node .github/converter/tools/verify-managed-conversions.mjs

      - name: Audit regenerated repository
        run: node .github/converter/tools/audit-repository.mjs

      - name: Generate reconciliation and Review inventory
        run: node .github/converter/tools/conversion-reports.mjs

      - name: Verify generated helper references, golden and source URLs
        run: node .github/converter/tests/artifacts.mjs

      - name: Upload regenerated canonical outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canonical-converter-output
          if-no-files-found: error
          path: |
            Adblock/Quantumult X/*.snippet
            Adblock/Surge/*.sgmodule
            Script/**
            README.md
            .github/monitor/.runtime/conversion-reconciliation.json
            .github/monitor/.runtime/conversion-reconciliation.md
            .github/monitor/.runtime/review-inventory.json
            .github/monitor/.runtime/review-inventory.md
            .github/monitor/.runtime/kelee-catalog.json
            .github/sources/loon.json
            Resource/Loon/**

      - name: Commit deterministic generated outputs to same-repo PR
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        run: |
          set -euo pipefail
          git add -A -- ".github/sources/loon.json" "Resource/Loon" "Adblock/Quantumult X" "Adblock/Surge" Script README.md
          if git diff --cached --quiet; then
            exit 0
          fi

          remote_sha="$(git ls-remote origin "refs/heads/${{ github.head_ref }}" | awk '{print $1}')"
          expected_sha="${{ github.event.pull_request.head.sha }}"
          if [[ -z "$remote_sha" || "$remote_sha" != "$expected_sha" ]]; then
            echo "::notice::PR head advanced while this run was executing; skip generated-output commit and let the newer run regenerate."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "canonical: regenerate converter outputs"
          git push origin HEAD:"${{ github.head_ref }}"

      - name: Verify canonical outputs are checked in
        shell: bash
        run: |
          set -euo pipefail
          status="$(git status --porcelain --untracked-files=all -- ".github/sources/loon.json" "Resource/Loon" "Adblock/Quantumult X" "Adblock/Surge" Script README.md)"
          if [[ -n "$status" ]]; then
            printf '%s\n' "$status"
            exit 1
          fi
