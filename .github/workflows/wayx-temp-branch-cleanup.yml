name: WayX Temporary Branch Cleanup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.repository == 'JuemingDC/WayX'
    runs-on: ubuntu-latest
    steps:
      - name: Remove merged temporary compatibility branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body --silent --show-error --request DELETE \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/JuemingDC/WayX/git/refs/heads/fix/qx-header-ordered-compat-20261103"
