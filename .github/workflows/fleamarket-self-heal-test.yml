# FleaMarket self-heal integration test
# Author: chance
# Updated: 2026-10-01
# Category: Automation / Integration Test / Self-Heal

name: FleaMarket Self-Heal Test

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/fleamarket-self-heal-test.yml"

permissions:
  contents: read

jobs:
  self-heal:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Capture baseline and isolate FleaMarket Catalog entry
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p monitor/.runtime/fleamarket-self-heal
          cp .github/sources/loon.json /tmp/wayx-loon-catalog.json

          {
            sha256sum "Resource/Loon/FleaMarket_remove_ads.lpx"
            sha256sum "Adblock/Quantumult X/FleaMarket_remove_ads.snippet"
            sha256sum "Adblock/Surge/FleaMarket_remove_ads.sgmodule"
            if [ -d "script/FleaMarket" ]; then
              find "script/FleaMarket" -type f -print0 | sort -z | xargs -0 -r sha256sum
            fi
          } > monitor/.runtime/fleamarket-self-heal/before.sha256

          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const file='.github/sources/loon.json';
          const catalog=JSON.parse(fs.readFileSync(file,'utf8'));
          const entry=catalog.find(item=>item.id==='FleaMarket');
          if (!entry) throw new Error('FleaMarket Catalog entry not found');
          if (entry.source !== 'https://kelee.one/Tool/Loon/Lpx/FleaMarket_remove_ads.lpx') {
            throw new Error('FleaMarket upstream is not the expected original kelee.one URL');
          }
          fs.writeFileSync(file,JSON.stringify([entry],null,2)+'\n');
          console.log('Isolated Catalog entry:',entry);
          NODE

      - name: Delete all managed FleaMarket artifacts in runner workspace
        shell: bash
        run: |
          set -euo pipefail
          rm -f "Resource/Loon/FleaMarket_remove_ads.lpx"
          rm -f "Adblock/Quantumult X/FleaMarket_remove_ads.snippet"
          rm -f "Adblock/Surge/FleaMarket_remove_ads.sgmodule"
          rm -rf "script/FleaMarket"

          test ! -e "Resource/Loon/FleaMarket_remove_ads.lpx"
          test ! -e "Adblock/Quantumult X/FleaMarket_remove_ads.snippet"
          test ! -e "Adblock/Surge/FleaMarket_remove_ads.sgmodule"
          test ! -e "script/FleaMarket"

          echo "FleaMarket managed artifacts removed inside GitHub Actions runner."

      - name: Re-fetch and convert through production sync workflow
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail
          node .github/scripts/sync-convert.mjs 2>&1 | tee monitor/.runtime/fleamarket-self-heal/sync.log

      - name: Restore full Catalog and verify regenerated artifacts
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/wayx-loon-catalog.json .github/sources/loon.json

          test -s "Resource/Loon/FleaMarket_remove_ads.lpx"
          test -s "Adblock/Quantumult X/FleaMarket_remove_ads.snippet"
          test -s "Adblock/Surge/FleaMarket_remove_ads.sgmodule"

          grep -F "https://kelee.one/Tool/Loon/Lpx/FleaMarket_remove_ads.lpx" .github/sources/loon.json >/dev/null

          {
            sha256sum "Resource/Loon/FleaMarket_remove_ads.lpx"
            sha256sum "Adblock/Quantumult X/FleaMarket_remove_ads.snippet"
            sha256sum "Adblock/Surge/FleaMarket_remove_ads.sgmodule"
            if [ -d "script/FleaMarket" ]; then
              find "script/FleaMarket" -type f -print0 | sort -z | xargs -0 -r sha256sum
            fi
          } > monitor/.runtime/fleamarket-self-heal/after.sha256

          diff -u             monitor/.runtime/fleamarket-self-heal/before.sha256             monitor/.runtime/fleamarket-self-heal/after.sha256             > monitor/.runtime/fleamarket-self-heal/before-after.diff || true

      - name: Canonical consistency check
        run: node converter/tools/regenerate-canonical.mjs

      - name: Audit regenerated repository
        run: node converter/tools/audit-repository.mjs

      - name: Generate reconciliation and Review inventory
        run: node converter/tools/conversion-reports.mjs

      - name: Verify generated helper references
        run: node converter/tests/generated-helper-refs.mjs

      - name: Verify original Source Script URLs
        run: node converter/tests/source-script-url-preservation.mjs

      - name: Record Git diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --             "Resource/Loon/FleaMarket_remove_ads.lpx"             "Adblock/Quantumult X/FleaMarket_remove_ads.snippet"             "Adblock/Surge/FleaMarket_remove_ads.sgmodule"             "script/FleaMarket"             > monitor/.runtime/fleamarket-self-heal/git.diff

          {
            echo "## FleaMarket Self-Heal Test"
            echo
            echo "- Deleted in runner: Source + QX + Surge + generated helper directory"
            echo "- Re-fetch source: https://kelee.one/Tool/Loon/Lpx/FleaMarket_remove_ads.lpx"
            echo "- Converter: .github/scripts/sync-convert.mjs"
            echo "- Canonical check: passed before this summary step"
            echo "- Repository audit/reconciliation/helper/source-URL checks: passed before this summary step"
            echo
            if cmp -s monitor/.runtime/fleamarket-self-heal/before.sha256 monitor/.runtime/fleamarket-self-heal/after.sha256; then
              echo "- Result: regenerated artifacts are byte-identical to the pre-test baseline."
            else
              echo "- Result: regenerated artifacts differ from the pre-test baseline; inspect the uploaded hash/diff files for legitimate upstream drift."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload self-heal evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fleamarket-self-heal-evidence
          if-no-files-found: error
          path: |
            Resource/Loon/FleaMarket_remove_ads.lpx
            Adblock/Quantumult X/FleaMarket_remove_ads.snippet
            Adblock/Surge/FleaMarket_remove_ads.sgmodule
            script/FleaMarket/**
            monitor/.runtime/fleamarket-self-heal/**
            monitor/.runtime/conversion-reconciliation.json
            monitor/.runtime/conversion-reconciliation.md
            monitor/.runtime/review-inventory.json
            monitor/.runtime/review-inventory.md
