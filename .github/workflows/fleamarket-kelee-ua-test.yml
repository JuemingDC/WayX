# FleaMarket self-heal retest with Kelee-compatible client User-Agent
# Author: chance
# Updated: 2026-10-01
# Category: Automation / Integration Test / Source Fetch

name: FleaMarket Kelee-UA Self-Heal Test

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/fleamarket-kelee-ua-test.yml"

permissions:
  contents: read

jobs:
  self-heal:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Capture baseline and isolate FleaMarket Catalog entry
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p monitor/.runtime/fleamarket-kelee-ua
          cp .github/sources/loon.json /tmp/wayx-loon-catalog.json

          {
            sha256sum "Resource/Loon/FleaMarket_remove_ads.lpx"
            sha256sum "Adblock/Quantumult X/FleaMarket_remove_ads.snippet"
            sha256sum "Adblock/Surge/FleaMarket_remove_ads.sgmodule"
            if [ -d "script/FleaMarket" ]; then
              find "script/FleaMarket" -type f -print0 | sort -z | xargs -0 -r sha256sum
            fi
          } > monitor/.runtime/fleamarket-kelee-ua/before.sha256

          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const file='.github/sources/loon.json';
          const catalog=JSON.parse(fs.readFileSync(file,'utf8'));
          const entry=catalog.find(item=>item.id==='FleaMarket');
          if (!entry) throw new Error('FleaMarket Catalog entry not found');
          if (entry.source !== 'https://kelee.one/Tool/Loon/Lpx/FleaMarket_remove_ads.lpx') {
            throw new Error('unexpected FleaMarket original source URL');
          }
          fs.writeFileSync(file,JSON.stringify([entry],null,2)+'\n');
          NODE

      - name: Probe Kelee client User-Agent variants with production Node fetch
        id: probe
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const url='https://kelee.one/Tool/Loon/Lpx/FleaMarket_remove_ads.lpx';
          const out='monitor/.runtime/fleamarket-kelee-ua/upstream-probe.txt';
          const candidates=[
            ['active-fetcher','Loon/764 CFNetwork/1498.700.1 Darwin/23.6.0 iPhone/17.6.1'],
            ['loon917','Loon/917 CFNetwork/1331.0.7 Darwin/21.4.0'],
            ['surge9527','Surge iOS/9527'],
            ['current-wayx','StashCore/2.7.1 Stash/2.7.1 Clash/1.11.0'],
          ];

          const lines=[];
          let selected='';
          for (const [name,ua] of candidates) {
            try {
              const controller=new AbortController();
              const timer=setTimeout(()=>controller.abort(),20000);
              const res=await fetch(url,{
                headers:{'User-Agent':ua,'Accept':'*/*'},
                redirect:'follow',
                signal:controller.signal,
              });
              clearTimeout(timer);
              const body=await res.text();
              lines.push(
                `[${name}] http=${res.status} bytes=${Buffer.byteLength(body)}`,
                `ua=${ua}`,
                `server=${res.headers.get('server') ?? ''}`,
                `content-type=${res.headers.get('content-type') ?? ''}`,
                `cf-ray=${res.headers.get('cf-ray') ?? ''}`,
                `body-prefix=${body.slice(0,160).replace(/\s+/g,' ')}`,
                ''
              );
              if (res.status===200 && body.includes('#!name=')) {
                selected=ua;
                break;
              }
            } catch (error) {
              lines.push(`[${name}] error=${error?.stack || error}`,'');
            }
          }

          fs.writeFileSync(out,lines.join('\n')+'\n');
          console.log(lines.join('\n'));

          const output=process.env.GITHUB_OUTPUT;
          if (!output) throw new Error('GITHUB_OUTPUT missing');
          fs.appendFileSync(output,`selected=${selected}\n`);

          if (!selected) {
            console.error('::error title=Kelee upstream::No tested client User-Agent passed Cloudflare with the same Node fetch stack used by WayX.');
            process.exit(1);
          }
          console.log('Selected Kelee-compatible User-Agent:',selected);
          NODE

      - name: Delete all managed FleaMarket artifacts in runner workspace
        shell: bash
        run: |
          set -euo pipefail
          rm -f "Resource/Loon/FleaMarket_remove_ads.lpx"
          rm -f "Adblock/Quantumult X/FleaMarket_remove_ads.snippet"
          rm -f "Adblock/Surge/FleaMarket_remove_ads.sgmodule"
          rm -rf "script/FleaMarket"

          test ! -e "Resource/Loon/FleaMarket_remove_ads.lpx"
          test ! -e "Adblock/Quantumult X/FleaMarket_remove_ads.snippet"
          test ! -e "Adblock/Surge/FleaMarket_remove_ads.sgmodule"
          test ! -e "script/FleaMarket"

      - name: Inject selected Kelee User-Agent into runner-only source fetch
        shell: bash
        env:
          KELEE_UA: ${{ steps.probe.outputs.selected }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const file='converter/src/source-fetch.mjs';
          const ua=process.env.KELEE_UA;
          if (!ua) throw new Error('KELEE_UA missing');
          const text=fs.readFileSync(file,'utf8');
          const next=text.replace(
            /export const WAYX_FETCH_UA = '[^']*';/,
            "export const WAYX_FETCH_UA = " + JSON.stringify(ua) + ";"
          );
          if (next===text) throw new Error('WAYX_FETCH_UA replacement did not occur');
          fs.writeFileSync(file,next);
          console.log('Runner-only source fetch UA:',ua);
          NODE

      - name: Re-fetch and convert through production sync workflow
        id: production_sync
        shell: bash
        run: |
          set -euo pipefail
          node .github/scripts/sync-convert.mjs 2>&1 | tee monitor/.runtime/fleamarket-kelee-ua/sync.log

      - name: Restore full Catalog
        if: always()
        shell: bash
        run: cp /tmp/wayx-loon-catalog.json .github/sources/loon.json

      - name: Verify regenerated artifacts
        shell: bash
        run: |
          set -euo pipefail
          test -s "Resource/Loon/FleaMarket_remove_ads.lpx"
          test -s "Adblock/Quantumult X/FleaMarket_remove_ads.snippet"
          test -s "Adblock/Surge/FleaMarket_remove_ads.sgmodule"

          {
            sha256sum "Resource/Loon/FleaMarket_remove_ads.lpx"
            sha256sum "Adblock/Quantumult X/FleaMarket_remove_ads.snippet"
            sha256sum "Adblock/Surge/FleaMarket_remove_ads.sgmodule"
            if [ -d "script/FleaMarket" ]; then
              find "script/FleaMarket" -type f -print0 | sort -z | xargs -0 -r sha256sum
            fi
          } > monitor/.runtime/fleamarket-kelee-ua/after.sha256

          diff -u             monitor/.runtime/fleamarket-kelee-ua/before.sha256             monitor/.runtime/fleamarket-kelee-ua/after.sha256             > monitor/.runtime/fleamarket-kelee-ua/before-after.diff || true

      - name: Canonical consistency check
        run: node converter/tools/regenerate-canonical.mjs

      - name: Audit regenerated repository
        run: node converter/tools/audit-repository.mjs

      - name: Generate reconciliation and Review inventory
        run: node converter/tools/conversion-reports.mjs

      - name: Verify generated helper references
        run: node converter/tests/generated-helper-refs.mjs

      - name: Verify original Source Script URLs
        run: node converter/tests/source-script-url-preservation.mjs

      - name: Record result
        if: always()
        shell: bash
        env:
          KELEE_UA: ${{ steps.probe.outputs.selected }}
        run: |
          {
            echo "## FleaMarket Kelee-UA Self-Heal Test"
            echo
            echo "- Original source: https://kelee.one/Tool/Loon/Lpx/FleaMarket_remove_ads.lpx"
            echo "- Selected User-Agent: \`$KELEE_UA\`"
            echo "- Deletion scope: Loon source + QX + Surge + generated helper directory"
            echo "- Fetch/conversion path: production .github/scripts/sync-convert.mjs"
            echo
            if [ -f monitor/.runtime/fleamarket-kelee-ua/after.sha256 ] && cmp -s monitor/.runtime/fleamarket-kelee-ua/before.sha256 monitor/.runtime/fleamarket-kelee-ua/after.sha256; then
              echo "- Result: regenerated artifacts are byte-identical to baseline."
            elif [ -f monitor/.runtime/fleamarket-kelee-ua/after.sha256 ]; then
              echo "- Result: regeneration succeeded but upstream/output differs from baseline; inspect evidence."
            else
              echo "- Result: regeneration did not complete."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fleamarket-kelee-ua-self-heal-evidence
          if-no-files-found: error
          path: |
            Resource/Loon/FleaMarket_remove_ads.lpx
            Adblock/Quantumult X/FleaMarket_remove_ads.snippet
            Adblock/Surge/FleaMarket_remove_ads.sgmodule
            script/FleaMarket/**
            monitor/.runtime/fleamarket-kelee-ua/**
            monitor/.runtime/conversion-reconciliation.json
            monitor/.runtime/conversion-reconciliation.md
            monitor/.runtime/review-inventory.json
            monitor/.runtime/review-inventory.md
