# Temporary live integration test for unified original-source transport.
# Author: chance
# Updated: 2026-10-01
# Category: Automation / Integration Test

name: Unified Upstream Fetch Full-Flow Test

on:
  pull_request:
    branches:
      - main
    paths:
      - "converter/src/source-fetch.mjs"
      - "converter/tools/fetch-upstream.py"
      - "converter/tests/source-fetch.mjs"
      - ".github/workflows/upstream-fetch-integration-test.yml"
      - ".github/scripts/sync-convert.mjs"
      - ".github/sources/loon.json"
      - "CONVERSION_SPEC.md"
      - "docs/conversion-spec/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-flow:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: "work/unified-upstream-fetch-20261001"
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Validate fetch implementation
        run: |
          node --check converter/src/source-fetch.mjs
          node --check converter/tests/source-fetch.mjs
          python -m py_compile converter/tools/fetch-upstream.py
          node converter/tests/source-fetch.mjs

      - name: Live fetch Kelee and RuCu6 through production source-fetch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p monitor/.runtime
          node --input-type=module <<'NODE' | tee monitor/.runtime/upstream-fetch-smoke.log
          import { fetchOriginalText, selectOriginalFetchProfile } from './converter/src/source-fetch.mjs';

          const targets=[
            ['Kelee','https://kelee.one/Tool/Loon/Lpx/FleaMarket_remove_ads.lpx'],
            ['RuCu6','https://rucu6.pages.dev/Plugins/webpage.lpx'],
          ];

          for (const [name,url] of targets) {
            const profile=selectOriginalFetchProfile(url);
            const text=await fetchOriginalText(url);
            if (!/^#!name=/m.test(text)) throw new Error(name+' response is not a Loon plugin');
            console.log(name+': profile='+profile.id+' transport='+profile.transport+' bytes='+Buffer.byteLength(text));
          }
          NODE

      - name: Pull all Catalog upstreams and convert
        shell: bash
        run: |
          set -o pipefail
          node .github/scripts/sync-convert.mjs 2>&1 | tee monitor/.runtime/loon-sync.log

      - name: Validate generated target formats
        shell: bash
        run: |
          set -o pipefail
          python .github/scripts/validate_conversion_policy.py 2>&1 | tee monitor/.runtime/validator.log

      - name: Audit repository
        shell: bash
        run: |
          set -o pipefail
          node converter/tools/audit-repository.mjs 2>&1 | tee monitor/.runtime/audit.log

      - name: Generate reconciliation and Review inventory
        shell: bash
        run: |
          set -o pipefail
          node converter/tools/conversion-reports.mjs 2>&1 | tee monitor/.runtime/reports.log

      - name: Verify generated helper references
        run: node converter/tests/generated-helper-refs.mjs

      - name: Verify original Source Script URLs
        run: node converter/tests/source-script-url-preservation.mjs

      - name: Verify canonical consistency after live sync
        run: node converter/tools/regenerate-canonical.mjs

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unified-upstream-fetch-full-flow-evidence
          if-no-files-found: warn
          path: |
            monitor/.runtime/upstream-fetch-smoke.log
            monitor/.runtime/loon-sync.log
            monitor/.runtime/validator.log
            monitor/.runtime/audit.log
            monitor/.runtime/reports.log
            monitor/.runtime/sync-failures.json
            monitor/.runtime/sync-failures.md
            monitor/.runtime/conversion-reconciliation.json
            monitor/.runtime/conversion-reconciliation.md
            monitor/.runtime/review-inventory.json
            monitor/.runtime/review-inventory.md
