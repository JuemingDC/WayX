# Temporary 5EPlay upstream reliability test.
# Author: chance
# Updated: 2026-10-01
# Category: Automation / Integration Test

name: 5EPlay Kelee Reliability Test

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/sources/loon.json"
      - ".github/workflows/5eplay-reliability-test.yml"

permissions:
  contents: write

jobs:
  reliability:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Probe original Kelee source through production fetch layer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .github/monitor/.runtime
          node --input-type=module <<'NODE' | tee .github/monitor/.runtime/5eplay-fetch.log
          import { fetchOriginalText, selectOriginalFetchProfile } from './.github/converter/src/source-fetch.mjs';

          const url='https://kelee.one/Tool/Loon/Lpx/5EPlay_remove_ads.lpx';
          const profile=selectOriginalFetchProfile(url);
          const text=await fetchOriginalText(url);

          if(profile.id !== 'kelee' || profile.transport !== 'python-urllib'){
            throw new Error('5EPlay did not select Kelee python-urllib transport');
          }
          if(!/^#!name=5EPlay/m.test(text)){
            throw new Error('original response is not the expected 5EPlay Loon plugin');
          }
          console.log('source='+url);
          console.log('profile='+profile.id);
          console.log('transport='+profile.transport);
          console.log('bytes='+Buffer.byteLength(text));
          NODE

      - name: Run production sync for 5EPlay only
        shell: bash
        run: |
          set -euo pipefail
          cp .github/sources/loon.json /tmp/wayx-full-loon-catalog.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const file='.github/sources/loon.json';
          const catalog=JSON.parse(fs.readFileSync(file,'utf8'));
          const entry=catalog.find(item=>item.id==='5EPlay');
          if(!entry) throw new Error('5EPlay catalog entry missing');
          fs.writeFileSync(file,JSON.stringify([entry],null,2)+'\n');
          NODE

          set +e
          set -o pipefail
          node .github/scripts/sync-convert.mjs 2>&1 | tee .github/monitor/.runtime/5eplay-sync.log
          sync_status=${PIPESTATUS[0]}
          set -e
          cp /tmp/wayx-full-loon-catalog.json .github/sources/loon.json
          exit "$sync_status"

      - name: Verify 5EPlay source and outputs
        shell: bash
        run: |
          set -euo pipefail
          test -s Resource/Loon/5EPlay_remove_ads.lpx
          test -s "Adblock/Quantumult X/5EPlay_remove_ads.snippet"
          test -s Adblock/Surge/5EPlay_remove_ads.sgmodule
          grep -q '^#!name=5EPlay' Resource/Loon/5EPlay_remove_ads.lpx
          grep -q '^# Target: Quantumult X$' "Adblock/Quantumult X/5EPlay_remove_ads.snippet"
          grep -q '^#!category=WayX$' Adblock/Surge/5EPlay_remove_ads.sgmodule
          {
            sha256sum Resource/Loon/5EPlay_remove_ads.lpx
            sha256sum "Adblock/Quantumult X/5EPlay_remove_ads.snippet"
            sha256sum Adblock/Surge/5EPlay_remove_ads.sgmodule
            if [ -d Script/5EPlay ]; then
              find Script/5EPlay -type f -print0 | sort -z | xargs -0 -r sha256sum
            fi
          } | tee .github/monitor/.runtime/5eplay-sha256.txt

      - name: Validate generated repository
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/validate_conversion_policy.py
          node .github/converter/tools/audit-repository.mjs
          node .github/converter/tools/conversion-reports.mjs
          node .github/converter/tests/generated-helper-refs.mjs
          node .github/converter/tests/source-script-url-preservation.mjs
          node .github/converter/tools/regenerate-canonical.mjs

      - name: Commit validated 5EPlay outputs to PR branch
        shell: bash
        run: |
          set -euo pipefail
          git add -A -- Resource/Loon/5EPlay_remove_ads.lpx "Adblock/Quantumult X/5EPlay_remove_ads.snippet" Adblock/Surge/5EPlay_remove_ads.sgmodule
          if [ -d Script/5EPlay ]; then
            git add -A -- Script/5EPlay
          fi

          if git diff --cached --quiet; then
            echo "5EPlay outputs already match production conversion."
            exit 0
          fi

          remote_sha="$(git ls-remote origin "refs/heads/${{ github.head_ref }}" | awk '{print $1}')"
          expected_sha="${{ github.event.pull_request.head.sha }}"
          if [[ -z "$remote_sha" || "$remote_sha" != "$expected_sha" ]]; then
            echo "::error::PR head changed during 5EPlay reliability test."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "canonical: add Kelee 5EPlay conversion outputs"
          git push origin HEAD:"${{ github.head_ref }}"

      - name: Upload 5EPlay reliability evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 5eplay-kelee-reliability-evidence
          if-no-files-found: warn
          path: |
            Resource/Loon/5EPlay_remove_ads.lpx
            Adblock/Quantumult X/5EPlay_remove_ads.snippet
            Adblock/Surge/5EPlay_remove_ads.sgmodule
            Script/5EPlay/**
            .github/monitor/.runtime/5eplay-fetch.log
            .github/monitor/.runtime/5eplay-sync.log
            .github/monitor/.runtime/5eplay-sha256.txt
            .github/monitor/.runtime/conversion-reconciliation.json
            .github/monitor/.runtime/conversion-reconciliation.md
            .github/monitor/.runtime/review-inventory.json
            .github/monitor/.runtime/review-inventory.md
