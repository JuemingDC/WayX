# Chance Upstream Automation
# Author: chance
# Updated: 2026-10-01
# Category: Automation / Sync / Conversion / Issue Tracking

name: Upstream Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "0 1 * * *"
      timezone: "Asia/Shanghai"

permissions:
  contents: write
  issues: write

concurrency:
  group: upstream-monitor
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout main baseline
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Validate converter core
        run: |
          node .github/converter/tests/checkpoint.mjs
          node .github/converter/tests/generic-identity.mjs
          node .github/converter/tests/genericity-audit.mjs
          node .github/converter/tests/spec-block-contract.mjs
          node .github/converter/tests/workflow-control.mjs
          node .github/converter/tests/repository-layout.mjs
          node .github/converter/tests/complex-source-inventory.mjs
          node .github/converter/tests/catalog-syntax-inventory.mjs
          node .github/converter/tests/catalog-legacy-syntax-inventory.mjs
          node .github/converter/tests/catalog-rule-inventory.mjs
          node .github/converter/tests/manual-assets.mjs
          node .github/converter/tests/upstream-automation.mjs
          node .github/converter/tests/myblockads-golden.mjs

      - name: Syntax check automation
        run: |
          node --check .github/scripts/sync-convert.mjs
          node --check .github/scripts/propose-conversion-issues.mjs
          node --check .github/converter/tools/conversion-reports.mjs
          node --check .github/converter/tools/audit-repository.mjs
          node --check .github/converter/tests/upstream-automation.mjs
          node --check .github/converter/tests/workflow-control.mjs
          node --check .github/converter/tests/repository-layout.mjs
          python -m py_compile .github/converter/tools/fetch-upstream.py .github/scripts/validate_conversion_policy.py monitor/monitor_upstreams.py

      - name: Prepare runtime logs
        run: mkdir -p monitor/.runtime

      - name: Pull all Catalog upstreams and convert
        id: loon_sync
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node .github/scripts/sync-convert.mjs 2>&1 | tee .github/monitor/.runtime/loon-sync.log

      - name: Check monitored upstream specifications
        id: monitor
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python .github/monitor/monitor_upstreams.py

      - name: Validate generated target formats
        id: validate
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python .github/scripts/validate_conversion_policy.py 2>&1 | tee .github/monitor/.runtime/validator.log

      - name: Audit repository
        id: audit
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node .github/converter/tools/audit-repository.mjs 2>&1 | tee .github/monitor/.runtime/audit.log

      - name: Generate reconciliation and Review inventory
        id: reports
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node .github/converter/tools/conversion-reports.mjs 2>&1 | tee .github/monitor/.runtime/reports.log

      - name: Verify generated helper references
        id: helper_refs
        continue-on-error: true
        run: node .github/converter/tests/generated-helper-refs.mjs

      - name: Verify original Source Script URLs
        id: source_urls
        continue-on-error: true
        run: node .github/converter/tests/source-script-url-preservation.mjs

      - name: Create or update conversion issues
        if: always()
        id: issues
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/propose-conversion-issues.mjs

      - name: Commit all validated automated outputs
        if: >-
          always() &&
          steps.validate.outcome == 'success' &&
          steps.audit.outcome == 'success' &&
          steps.reports.outcome == 'success' &&
          steps.helper_refs.outcome == 'success' &&
          steps.source_urls.outcome == 'success' &&
          steps.issues.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "chance-upstream-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A Resource/Loon Adblock script boxjs .github/monitor/state.json .github/monitor/upstream

          if git diff --cached --quiet; then
            echo "No validated upstream/conversion changes to commit."
            exit 0
          fi

          REMOTE_MAIN="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          if [ -z "$REMOTE_MAIN" ] || [ "$REMOTE_MAIN" != "$GITHUB_SHA" ]; then
            echo "::notice::main advanced after generation; skip this push and regenerate from the new baseline on the next run."
            exit 0
          fi

          git commit -m "chore: sync upstream and regenerate targets"
          git push origin HEAD:main

      - name: Upload automation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upstream-conversion-reports
          if-no-files-found: warn
          path: |
            .github/monitor/.runtime/loon-sync.log
            .github/monitor/.runtime/validator.log
            .github/monitor/.runtime/audit.log
            .github/monitor/.runtime/reports.log
            .github/monitor/.runtime/sync-failures.json
            .github/monitor/.runtime/sync-failures.md
            .github/monitor/.runtime/conversion-issues.md
            .github/monitor/.runtime/upstream_changes.md
            .github/monitor/.runtime/conversion-reconciliation.json
            .github/monitor/.runtime/conversion-reconciliation.md
            .github/monitor/.runtime/review-inventory.json
            .github/monitor/.runtime/review-inventory.md

      - name: Surface unresolved automation failures
        if: always()
        shell: bash
        env:
          LOON_SYNC: ${{ steps.loon_sync.outcome }}
          MONITOR: ${{ steps.monitor.outcome }}
          VALIDATE: ${{ steps.validate.outcome }}
          AUDIT: ${{ steps.audit.outcome }}
          REPORTS: ${{ steps.reports.outcome }}
          HELPER_REFS: ${{ steps.helper_refs.outcome }}
          SOURCE_URLS: ${{ steps.source_urls.outcome }}
          ISSUES: ${{ steps.issues.outcome }}
        run: |
          set -euo pipefail
          failed=0
          for item in             "loon_sync=$LOON_SYNC"             "monitor=$MONITOR"             "validate=$VALIDATE"             "audit=$AUDIT"             "reports=$REPORTS"             "helper_refs=$HELPER_REFS"             "source_urls=$SOURCE_URLS"             "issues=$ISSUES"; do
            name="${item%%=*}"
            value="${item#*=}"
            if [ "$value" != "success" ]; then
              echo "::error title=Upstream automation::${name} outcome=${value}"
              failed=1
            fi
          done
          exit "$failed"
