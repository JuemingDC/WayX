# Chance Upstream Monitor
# Author: chance
# Updated: 2026-09-29
# Category: Automation / Sync / Conversion / Work Handoff

name: Upstream Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "0 1 * * *"
      timezone: "Asia/Shanghai"

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: upstream-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check for pending Work review
        id: pending
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          OPEN_PR="$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --label work-review \
            --json number \
            --jq '.[0].number // empty')"
          if [ -n "$OPEN_PR" ]; then
            echo "blocked=true" >> "$GITHUB_OUTPUT"
            echo "Existing Work review PR #$OPEN_PR is still open; skip this cycle."
          else
            echo "blocked=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.pending.outputs.blocked != 'true'
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        if: steps.pending.outputs.blocked != 'true'
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Validate WayX converter core
        if: steps.pending.outputs.blocked != 'true'
        run: |
          node converter/tests/checkpoint.mjs
          node converter/tests/generic-identity.mjs
          node converter/tests/genericity-audit.mjs
          node converter/tests/spec-block-contract.mjs
          node converter/tests/complex-source-inventory.mjs
          node converter/tests/unknown-issue-markers.mjs
          python converter/tests/test_conversion_gate.py
          node converter/tests/myblockads-golden.mjs

      - name: Set up Python
        if: steps.pending.outputs.blocked != 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Syntax check conversion automation
        if: steps.pending.outputs.blocked != 'true'
        run: |
          node --check .github/scripts/sync-convert.mjs
          node --check .github/scripts/propose-conversion-issues.mjs
          python -m py_compile .github/scripts/conversion_gate.py .github/scripts/validate_conversion_policy.py converter/tests/test_conversion_gate.py

      - name: Install sync dependency
        if: steps.pending.outputs.blocked != 'true'
        run: python -m pip install --disable-pip-version-check requests

      - name: Prepare runtime logs
        if: steps.pending.outputs.blocked != 'true'
        run: mkdir -p monitor/.runtime

      - name: Sync all catalog Loon sources and convert deterministically
        if: steps.pending.outputs.blocked != 'true'
        id: loon_sync
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node .github/scripts/sync-convert.mjs 2>&1 | tee monitor/.runtime/loon-sync.log


      - name: Check official upstream specifications
        if: steps.pending.outputs.blocked != 'true'
        id: monitor
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python monitor/monitor_upstreams.py

      - name: Validate deterministic generated outputs
        if: steps.pending.outputs.blocked != 'true'
        id: validate
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python .github/scripts/validate_conversion_policy.py 2>&1 | tee monitor/.runtime/validator.log

      - name: Propose issues for unknown conversions
        if: steps.pending.outputs.blocked != 'true'
        id: issues
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/propose-conversion-issues.mjs

      - name: Classify conversion changes
        if: steps.pending.outputs.blocked != 'true'
        id: gate
        run: python .github/scripts/conversion_gate.py

      - name: Build Work review body
        if: >
          steps.pending.outputs.blocked != 'true' &&
          (steps.monitor.outputs.has_review == 'true' ||
           steps.gate.outputs.requires_work == 'true' ||
           steps.issues.outputs.has_unknown == 'true' ||
           steps.issues.outcome != 'success' ||
           steps.loon_sync.outcome != 'success' ||
           steps.validate.outcome != 'success')
        id: review
        shell: bash
        run: |
          set -euo pipefail
          BODY="monitor/.runtime/work_review_body.md"
          {
            echo "# WayX automated upstream review"
            echo
            echo "GitHub Actions already applied deterministic Safe Tier conversions. ChatGPT Work must review the remaining semantic-risk changes."
            echo
            echo "## Actions status"
            echo
            echo "- Loon converter: ${{ steps.loon_sync.outcome }}"
            echo "- Validator: ${{ steps.validate.outcome }}"
            echo "- Unknown issue proposer: ${{ steps.issues.outcome }}"
            echo
            if [ -f "${{ steps.gate.outputs.summary }}" ]; then
              cat "${{ steps.gate.outputs.summary }}"
              echo
            fi
            if [ -f "${{ steps.monitor.outputs.review_summary }}" ]; then
              cat "${{ steps.monitor.outputs.review_summary }}"
              echo
            fi
            if [ -f "${{ steps.issues.outputs.summary }}" ]; then
              cat "${{ steps.issues.outputs.summary }}"
              echo
            fi
            for LOG in monitor/.runtime/loon-sync.log monitor/.runtime/validator.log; do
              if [ -s "$LOG" ]; then
                echo "## $(basename "$LOG")"
                echo
                echo '```text'
                tail -n 80 "$LOG"
                echo '```'
                echo
              fi
            done
            echo "## Work instruction"
            echo
            echo "Read and execute CONVERSION_SPEC.md, the relevant docs/conversion-spec blocks, and monitor/WORK_TASK_PROMPT.md strictly. CONVERSION_POLICY.md and LOON_NEW_SYNTAX_CONVERSION.md are deprecated indexes only. A converter/validator failure is Review Tier and must never be committed directly to main."
          } > "$BODY"
          echo "body=$BODY" >> "$GITHUB_OUTPUT"

      - name: Commit Safe Tier changes directly
        if: >
          steps.pending.outputs.blocked != 'true' &&
          steps.monitor.outputs.has_review != 'true' &&
          steps.gate.outputs.requires_work != 'true' &&
          steps.issues.outputs.has_unknown != 'true' &&
          steps.issues.outcome == 'success' &&
          steps.loon_sync.outcome == 'success' &&
          steps.validate.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "chance-upstream-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A Resource/Loon Adblock script boxjs monitor/state.json
          if [ -d upstream ]; then git add -A upstream; fi
          if git diff --cached --quiet; then
            echo "No Safe Tier changes to commit."
            exit 0
          fi
          REMOTE_MAIN="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          if [ -z "$REMOTE_MAIN" ] || [ "$REMOTE_MAIN" != "$GITHUB_SHA" ]; then
            echo "::notice::main advanced after this run started; skip Safe Tier push so a fresh run can regenerate from the new base."
            exit 0
          fi
          git commit -m "chore: sync upstream and apply safe conversions"
          git push origin HEAD:main

      - name: Open Work review PR
        if: >
          steps.pending.outputs.blocked != 'true' &&
          (steps.monitor.outputs.has_review == 'true' ||
           steps.gate.outputs.requires_work == 'true' ||
           steps.issues.outputs.has_unknown == 'true' ||
           steps.issues.outcome != 'success' ||
           steps.loon_sync.outcome != 'success' ||
           steps.validate.outcome != 'success')
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEW_BODY: ${{ steps.review.outputs.body }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "chance-upstream-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BRANCH="work/upstream-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git switch -c "$BRANCH"
          git add -A Resource/Loon Adblock script boxjs monitor/state.json
          if [ -d upstream ]; then git add -A upstream; fi
          if git diff --cached --quiet; then
            MARKER="monitor/review-queue/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.md"
            mkdir -p "$(dirname "$MARKER")"
            cp "$REVIEW_BODY" "$MARKER"
            git add "$MARKER"
            echo "Review requested without a normal repository diff; persisted $MARKER so the Work review PR cannot be lost."
          fi
          git commit -m "chore: prepare upstream Work review"
          git push --set-upstream origin "$BRANCH"
          gh label create work-review --description "Requires ChatGPT Work semantic review" --color "B8860B" --force >/dev/null 2>&1 || true
          gh label create work-complete --description "Work review completed; safe to merge and clean up" --color "2EA44F" --force >/dev/null 2>&1 || true
          gh label create work-reject --description "Upstream change rejected; close without merging" --color "B60205" --force >/dev/null 2>&1 || true
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "Upstream semantic review: $(date -u +%Y-%m-%d)" \
            --body-file "$REVIEW_BODY" \
            --label work-review
