# Chance Upstream Monitor
# Author: chance
# Updated: 2026-09-28
# Category: Automation / Sync / Conversion / Work Handoff

name: Upstream Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "0 1 * * *"
      timezone: "Asia/Shanghai"

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: upstream-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check for pending Work review
        id: pending
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          OPEN_PR="$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --label work-review \
            --json number \
            --jq '.[0].number // empty')"
          if [ -n "$OPEN_PR" ]; then
            echo "blocked=true" >> "$GITHUB_OUTPUT"
            echo "Existing Work review PR #$OPEN_PR is still open; skip this cycle."
          else
            echo "blocked=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.pending.outputs.blocked != 'true'
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        if: steps.pending.outputs.blocked != 'true'
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Set up Python
        if: steps.pending.outputs.blocked != 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install sync dependency
        if: steps.pending.outputs.blocked != 'true'
        run: python -m pip install --disable-pip-version-check requests

      - name: Sync simple Loon sources and convert deterministically
        if: steps.pending.outputs.blocked != 'true'
        id: loon_sync
        continue-on-error: true
        run: node .github/scripts/sync-convert.mjs

      - name: Sync RuCu6 sources and scripts
        if: steps.pending.outputs.blocked != 'true'
        env:
          HTTP_PROXY_URL: ${{ secrets.HTTP_PROXY_URL }}
        run: python .github/scripts/sync_rucu6.py

      - name: Check official upstream specifications
        if: steps.pending.outputs.blocked != 'true'
        id: monitor
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python monitor/monitor_upstreams.py

      - name: Validate deterministic generated outputs
        if: steps.pending.outputs.blocked != 'true'
        id: validate
        continue-on-error: true
        run: python .github/scripts/validate_conversion_policy.py

      - name: Classify conversion changes
        if: steps.pending.outputs.blocked != 'true'
        id: gate
        run: python .github/scripts/conversion_gate.py

      - name: Build Work review body
        if: >
          steps.pending.outputs.blocked != 'true' &&
          (steps.monitor.outputs.has_review == 'true' || steps.gate.outputs.requires_work == 'true' || steps.loon_sync.outcome != 'success' || steps.validate.outcome != 'success')
        id: review
        shell: bash
        run: |
          set -euo pipefail
          BODY="monitor/.runtime/work_review_body.md"
          mkdir -p monitor/.runtime
          {
            echo "# WayX automated upstream review"
            echo
            echo "GitHub Actions already applied deterministic safe-tier conversions. ChatGPT Work must review the remaining semantic-risk changes."
            echo
            echo "## Actions status"
            echo
            echo "- Loon converter: ${{ steps.loon_sync.outcome }}"
            echo "- Validator: ${{ steps.validate.outcome }}"
            echo
            if [ -f "${{ steps.gate.outputs.summary }}" ]; then
              cat "${{ steps.gate.outputs.summary }}"
              echo
            fi
            if [ -f "${{ steps.monitor.outputs.review_summary }}" ]; then
              cat "${{ steps.monitor.outputs.review_summary }}"
              echo
            fi
            echo "## Work instruction"
            echo
            echo "Read and execute monitor/WORK_TASK_PROMPT.md strictly. Converter/validator failure is Review Tier and must never be committed directly to main."
          } > "$BODY"
          echo "body=$BODY" >> "$GITHUB_OUTPUT"
      - name: Commit safe-tier changes directly
        if: >
          steps.pending.outputs.blocked != 'true' &&
          steps.monitor.outputs.has_review != 'true' &&
          steps.gate.outputs.requires_work != 'true' &&
          steps.loon_sync.outcome == 'success' &&
          steps.validate.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "chance-upstream-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A Resource/Loon adblock script monitor/state.json
          if [ -d upstream ]; then
            git add -A upstream
          fi
          if git diff --cached --quiet; then
            echo "No safe-tier changes to commit."
            exit 0
          fi

          git commit -m "chore: sync upstream and apply safe conversions"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Open Work review PR
        if: >
          steps.pending.outputs.blocked != 'true' &&
          (steps.monitor.outputs.has_review == 'true' || steps.gate.outputs.requires_work == 'true' || steps.loon_sync.outcome != 'success' || steps.validate.outcome != 'success')
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEW_BODY: ${{ steps.review.outputs.body }}
