# Chance Upstream Monitor
# Author: chance
# Created: 2026-09-28
# Category: Automation / Upstream Monitor

name: Upstream Monitor

on:
  workflow_dispatch:
  schedule:
    # 每天北京时间 01:00。GitHub Actions 当前支持 IANA timezone。
    - cron: "0 1 * * *"
      timezone: "Asia/Shanghai"

permissions:
  contents: write
  issues: write

concurrency:
  group: upstream-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Check upstreams
        id: monitor
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # 可选 Repository Variable；不设置时脚本默认 gpt-5.6-sol。
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
        run: python monitor/monitor_upstreams.py

      - name: Commit synchronized changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "chance-upstream-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A monitor
          if [ -d upstream ]; then
            git add -A upstream
          fi

          if git diff --cached --quiet; then
            echo "No tracked changes to commit."
            exit 0
          fi

          git commit -m "chore: sync upstream sources"
          git push

      - name: Create review issue
        if: steps.monitor.outputs.has_review == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SUMMARY_FILE: ${{ steps.monitor.outputs.review_summary }}
        shell: bash
        run: |
          set -euo pipefail
          gh label create upstream-review \
            --description "Upstream change needs semantic review" \
            --color "B8860B" \
            --force >/dev/null 2>&1 || true

          gh issue create \
            --title "Upstream semantic review $(date -u +%Y-%m-%d)" \
            --body-file "$SUMMARY_FILE" \
            --label upstream-review
